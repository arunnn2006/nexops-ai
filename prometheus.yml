# Prometheus scrapes the NexOps backend running on the HOST (uvicorn on port 8000).
# host.docker.internal works on Docker Desktop (Windows/macOS); docker-compose adds it for Linux too.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: nexops-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
